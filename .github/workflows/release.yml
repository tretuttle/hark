name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<version> from manifest.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "26"
          cache: true
          run-install: true

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check
        run: vp run check

      - name: Pack extension
        run: pnpm --filter @hark/extension run pack

      - name: Test XPI archive
        run: unzip -t apps/extension/dist/hark-*.xpi

      - name: Compute SHA256SUMS
        run: |
          cd apps/extension/dist
          sha256sum hark-*.xpi > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_TAG}" ]; then
              TAG="${INPUT_TAG}"
            else
              VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("apps/extension/src/manifest.json", "utf8")).version')"
              TAG="v${VERSION}"
            fi
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" apps/extension/dist/hark-*.xpi apps/extension/dist/SHA256SUMS --clobber
          else
            gh release create "${TAG}" apps/extension/dist/hark-*.xpi apps/extension/dist/SHA256SUMS \
              --title "${TAG}" \
              --generate-notes
          fi
